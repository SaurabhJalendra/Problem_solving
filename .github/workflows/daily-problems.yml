name: Daily Problem Solver

on:
  # Scheduled by cron-job.org (Practice reminder, 20:45 IST) via this workflow's
  # dispatch endpoint — NOT GitHub's native `schedule:` (removed to stop a duplicate
  # nightly reminder firing from both GitHub cron and cron-job.org).
  workflow_dispatch: {}

concurrency:
  group: daily-problems
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send practice reminder email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TZ: Asia/Kolkata
        run: python scripts/send_daily_problems.py
